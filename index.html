<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>開票工作台｜發票草稿與金額編列</title>
  <link rel="stylesheet" href="style.css?v=20261104c">
  <link rel="stylesheet" href="workspace.css?v=20261104d">
</head>
<body>
  <header class="app-hero">
    <h1>開票工作台</h1>
    <nav aria-label="主要功能"><a class="active" href="#transactionText" aria-current="page">開立草稿</a><a href="#draftFiles">草稿檔案</a></nav>
  </header>

  <main>
    <nav class="mobile-view-controls" aria-label="工作區檢視">
      <button type="button" id="showEditor" aria-pressed="true">編輯資料</button>
      <button type="button" id="showPreview" class="secondary" aria-pressed="false">發票預覽</button>
    </nav>
    <section class="workspace-panel">
      <details class="draft-tools" id="draftFiles"><summary>草稿檔案 <span id="saveStatus" role="status" aria-live="polite">尚未儲存</span></summary><div class="draft-actions">
        <button type="button" id="saveDraft">匯出草稿檔</button>
        <button type="button" class="secondary" id="loadDraft">載入草稿檔</button>
        <button type="button" class="secondary" id="newDraft">建立新草稿</button>
        <input id="draftFile" type="file" accept="application/json,.json" hidden>
      </div></details>
      <div class="transaction-section">
        <label for="transactionText" class="section-label">交易描述</label>
        <textarea id="transactionText" rows="3" placeholder="抬頭：範例商行；統編：12345678；課程教學 4 堂，每堂 3000 元；教材製作 1 式，每式 2000 元；以上未稅。"></textarea>
        <button type="button" id="parseTransaction">整理開票內容</button>
        <div class="price-confirmation">
          <label>描述中的價格<select id="sourcePriceType"><option value="pending">待確認</option><option value="untaxed">未稅</option><option value="taxed">含稅</option></select></label>
          <button type="button" class="secondary" id="confirmSourcePrice">確認並套用價格類型</button>
        </div>
        <p id="sourceStatus" role="status" aria-live="polite"></p>
        <details class="source-comparison"><summary>原文與資料核對</summary><div id="sourceReview"></div></details>
      </div>

      <div class="summary" aria-label="金額合計">
        <div class="metric">
          <span>未稅合計</span>
          <strong id="subtotal">$0</strong>
        </div>
        <div class="metric">
          <span>營業稅</span>
          <strong id="tax">$0</strong>
        </div>
        <div class="metric highlight">
          <span>含稅總額</span>
          <strong id="total">$0</strong>
        </div>
        <div class="metric">
          <span>品項數</span>
          <strong id="itemCount">0</strong>
        </div>
        <div class="metric wide-metric">
          <span>中文大寫總額</span>
          <strong id="totalChinese">零元整</strong>
        </div>
      </div>

      <div class="subsection-title settings-title">
        <span>發票資訊</span>
      </div>

      <div class="settings">
        <label>
          發票類型
          <select id="invoiceType">
            <option value="triplicate">三聯式，買受人為營業人</option>
            <option value="duplicate">二聯式，買受人為非營業人</option>
          </select>
        </label>
        <label>
          開立日期
          <input type="date" id="invoiceDate">
        </label>
        <label>
          發票字軌號碼
          <input type="text" id="invoiceNo" maxlength="10" placeholder="2 碼英文＋8 碼數字，例如 AB12345678">
        </label>
        <label>
          備註
          <input type="text" id="invoiceMemo" placeholder="例如 合約尾款、專案款">
        </label>
      </div>

      <div class="subsection-title buyer-title">
        <span>買受人資料</span>
      </div>

      <div class="buyer-fields" id="buyerFields">
        <label>
          買受人名稱
          <input type="text" id="buyerName" placeholder="公司或商號名稱">
        </label>
        <label>
          買受人統一編號
          <div class="lookup-actions">
            <input type="text" id="buyerTaxId" inputmode="numeric" maxlength="8" placeholder="8 碼統編">
            <button type="button" class="secondary" id="lookupByTaxId">查詢</button>
          </div>
          <span class="status" id="taxIdStatus"></span>
        </label>
        <label>
          買受人地址
          <input type="text" id="buyerAddress" placeholder="選填">
        </label>
        <div class="lookup-results" id="companyLookupResults"></div>
      </div>

      <div class="validation" id="validationBox"></div>

      <div class="subsection-title items-title">
        <span>品項明細 <small>金額為未稅</small></span>
        <div class="toolbar"><button type="button" class="secondary" id="addRow"><img class="button-icon" src="assets/icons/plus.svg" alt="">新增品項</button><button type="button" class="secondary" id="itemDetails" aria-pressed="false">稅別設定</button></div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width: 28%;">品項</th>
              <th style="width: 10%;">數量</th>
              <th style="width: 13%;">單價</th>
              <th style="width: 12%;">單價類型</th>
              <th style="width: 12%;">稅別</th>
              <th style="width: 12%;">未稅小計</th>
              <th style="width: 13%;">稅額</th>
              <th style="width: 13%;">含稅小計</th>
              <th style="width: 8%;">反推</th>
              <th class="row-action">操作</th>
            </tr>
          </thead>
          <tbody id="itemsBody"></tbody>
        </table>
      </div>

      <div class="editor-footer"><button type="button" class="secondary" id="copySummary">複製摘要</button></div>
    </section>

    <div class="right-workspace">
      <section class="preview-panel">
        <div class="preview-heading"><h2>統一發票預覽 <span class="draft-badge">開票草稿</span></h2>
          <div class="toolbar"><button type="button" class="secondary" id="downloadInvoice" title="下載發票草稿 PNG"><img class="button-icon" src="assets/icons/download.svg" alt="">下載 PNG</button><button type="button" class="secondary" id="printInvoice"><img class="button-icon" src="assets/icons/printer.svg" alt="">列印</button></div>
        </div>
        <div class="print-preview" id="printPreview"></div>
        <p id="exportStatus" role="status" aria-live="polite"></p>
      </section>
    <aside class="strategy-panel">
      <div class="section-head">
        <div>
          <h2>編列版本</h2>
          <p class="hint">選擇版本後，套用至品項明細。</p>
        </div>
      </div>
      <div class="side-body">
        <details class="allocation-settings"><summary>金額編列設定</summary><div class="form-grid">
          <label class="field">
            目標金額
            <input type="number" min="0" step="1" id="targetAmount" placeholder="例如 30000">
          </label>
          <label class="field">
            目標類型
            <select id="targetType">
              <option value="taxed">含稅總額</option>
              <option value="untaxed">未稅金額</option>
            </select>
          </label>
          <label class="field">
            稅率
            <input type="number" min="0" step="0.1" id="taxRate" value="5">
          </label>
          <label class="field">
            服務類型
            <select id="serviceType">
              <option value="consulting">顧問服務</option>
              <option value="teaching">教學課程</option>
              <option value="system">系統建置</option>
              <option value="design">設計製作</option>
              <option value="event">活動執行</option>
              <option value="content">教材內容</option>
              <option value="general">一般服務</option>
            </select>
          </label>
          <label class="field">
            拆分筆數
            <select id="splitCount">
              <option value="3">3 筆，最常用</option>
              <option value="2">2 筆，簡潔</option>
              <option value="4">4 筆，較細</option>
              <option value="5">5 筆，填滿紙本</option>
            </select>
          </label>
          <label class="field">
            編列風格
            <select id="allocationStyle">
              <option value="main-heavy">主服務占比較高</option>
              <option value="balanced">平均但不死板</option>
              <option value="support-heavy">執行與輔助占比較高</option>
            </select>
          </label>
          <button type="button" id="suggest">產生建議</button>
          <button type="button" class="secondary" id="applyBest">套用最佳建議</button>
        </div></details>

        <div class="notice">提醒：編列建議是把實際服務內容整理成發票明細，不應為了湊金額創造不存在的交易、品名或數量。</div>
        <div id="suggestions"></div>
        <p id="planStatus" role="status" aria-live="polite"></p>
        <button type="button" class="secondary" id="undoPlan" disabled>復原上次套用</button>
      </div>
    </aside>
    </div>
  </main>

  <script src="assets/vendor/html-to-image/html-to-image.js?v=1.11.13"></script>
  <script src="script.js?v=20261104d"></script>
  <script src="draft-workflow.js?v=20261104d"></script>
</body>
</html>
